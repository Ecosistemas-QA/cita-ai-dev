name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build y verificación de tipos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Valores de relleno. El build no se conecta a ningún servicio, pero
          # necesita que estas variables existan: config.ts corta la compilación si
          # faltan las de Supabase, y el cliente de Resend se construye al importar
          # el módulo, así que "next build" lo ejecuta al recolectar las rutas.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          NEXT_PUBLIC_APP_URL: https://example.invalid

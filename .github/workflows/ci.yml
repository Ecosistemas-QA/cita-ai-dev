name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build y verificación de tipos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Valores de relleno: el build solo necesita que las variables existan,
          # porque src/lib/config.ts corta la compilación si faltan. No se conecta
          # a ningún servicio durante el build.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
